version: "1"

services:
  # ----------------------------------------------------------------------------
  # FastAPI Web Service (Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: legal-ai-backend
    runtime: python
    plan: free
    region: oregon # or ohio, frankfurt, singapore
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # Link your Render Environment Group named 'prod'
      - fromGroup: prod
      # Default fallback values if not present in the group
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
